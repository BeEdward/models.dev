# Pricing: GET https://api.tokenify.dev/v1/models and https://www.tokenify.dev/pricing/
# (accessed 2026-10-02), USD per 1M tokens. Reasoning tokens are billed at the
# output rate.
# Reasoning control on this host is on/off only: `reasoning: {"enabled": false}`,
# `thinking: {"type": "disabled"}` or `reasoning_effort: "none"|"minimal"` turn it
# off. Other `reasoning_effort` values are accepted but do not grade depth
# (documented in https://www.tokenify.dev/llms-full.txt, measured 2026-10-01),
# hence a toggle and no effort list.
# Time-of-day pricing: these are the peak rates. Off-peak (outside Mon-Fri
# 01:00-04:00 and 06:00-10:00 UTC) is 0.09 input / 0.36 output / 0.003 cache
# read; the schema has no time-of-day tier, so the dearer rate is published.
base_model = "deepseek/deepseek-v4.1-flash"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.60
reasoning = 0.60
cache_read = 0.006
