# Pricing: GET https://api.tokenify.dev/v1/models and https://www.tokenify.dev/pricing/
# (accessed 2026-10-02), USD per 1M tokens. Reasoning tokens are billed at the
# output rate.
# Always reasons on this host, as on the lab API (thinking cannot be disabled).
# Measured 2026-10-02, /v1/chat/completions:
#   off (reasoning.enabled=false / thinking disabled / reasoning_effort=none, 12 runs over two sessions):
#     reasoning tokens [0, 27, 27, 27, 31, 32, 33, 35, 35, 38, 42, 42]
#   effort, short prompt (median of 4): low 117 medium 116 high 111 max 117
#   repeat run, short prompt (median of 4): low 100 medium 115 high 113 max 133.5
#   default (reasoning on): [102, 122, 126, 169]
# The off controls shorten reasoning but do not switch it off, so this is not a toggle.
# No effort list. Host docs, verbatim (https://www.tokenify.dev/llms-full.txt, section
# "Thinking costs output tokens"): "Every documented `reasoning.effort` is accepted, but
# thinking is on or off here with nothing in between, so the depth is advisory". So
# low/medium/high/max all reach the model as the same "on", as the flat medians show.
# Input modalities narrowed to what this host documents: text and image.
base_model = "zhipuai/glm-5.3-flash"

reasoning_options = []

[interleaved]
field = "reasoning_content"

[cost]
input = 0.15
output = 0.50
reasoning = 0.50
cache_read = 0.03

[modalities]
input = ["text", "image"]
