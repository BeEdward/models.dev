# Pricing: GET https://api.tokenify.dev/v1/models and https://www.tokenify.dev/pricing/
# (accessed 2026-10-02), USD per 1M tokens. Reasoning tokens are billed at the
# output rate.
# Toggle: thinking.type = enabled|disabled; also reasoning.enabled = true|false and
# reasoning_effort = none (off). Measured on this host 2026-10-02, /v1/chat/completions:
#   off (reasoning.enabled=false / thinking disabled / reasoning_effort=none, 6 runs): reasoning tokens [0, 0, 0, 0, 0, 0]
#   effort, short prompt (median of 4): low 795 medium 846 high 757 max 706
#   effort, 5-person seating puzzle (median of 4): low 1111 (range 1036-2542) high 1640 (range 989-6730) max 3915 (range 966-5181)
#   repeat run, short prompt (median of 4): low 919.5 medium 601.5 high 645.5 max 786.5; off 6/6 at 0 reasoning tokens
# No effort list. Host docs, verbatim (https://www.tokenify.dev/llms-full.txt, section
# "Thinking costs output tokens"): "`reasoning.effort` of "none" or "minimal" means off,
# and "low", "medium", "high" or "max" means on." and "Every documented `reasoning.effort`
# is accepted, but thinking is on or off here with nothing in between, so the depth
# is advisory". So low/medium/high/max all reach the model as the same "on"; the per-level
# medians above do not order across prompts and their ranges overlap (run-to-run variance).
# Reasoning is returned in message.reasoning_content when on, absent when off.
base_model = "zhipuai/glm-5.2"

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.70
output = 2.20
reasoning = 2.20
cache_read = 0.26
